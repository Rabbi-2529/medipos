{% load i18n %}{% if current_tenant %}
<div class="dropdown">
  <button class="outlet-chip" type="button" {% if allowed_outlets|length > 1 %}data-bs-toggle="dropdown" aria-expanded="false"{% else %}disabled{% endif %}
          title="{% translate 'Outlet you are working in' %}">
    <i class="bi bi-shop"></i>
    <span class="d-none d-md-inline">{% if current_outlet %}{{ current_outlet.name }}{% else %}{% translate "No outlet" %}{% endif %}</span>
    {% if allowed_outlets|length > 1 %}<i class="bi bi-chevron-down small"></i>{% endif %}
  </button>
  {% if allowed_outlets|length > 1 %}
  <ul class="dropdown-menu dropdown-menu-end">
    <li><h6 class="dropdown-header">{% translate "Switch outlet" %}</h6></li>
    {% for outlet in allowed_outlets %}
    <li>
      <form method="post" action="{% url 'outlets:enter' outlet.pk %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button class="dropdown-item{% if outlet.pk == current_outlet.pk %} active{% endif %}" type="submit">
          <i class="bi {% if outlet.pk == current_outlet.pk %}bi-check2{% else %}bi-shop{% endif %}"></i> {{ outlet.name }}
        </button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
{% endif %}
