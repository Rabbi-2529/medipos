{% load i18n %}
<header class="app-topbar">
  <button class="btn-icon d-lg-none" type="button" data-sidebar-toggle aria-label="{% translate 'Open menu' %}">
    <i class="bi bi-list"></i>
  </button>
  <button class="topbar-search" type="button" data-command-open>
    <i class="bi bi-search"></i>
    <span class="d-none d-sm-inline">{% translate "Search menu" %}</span>
    <kbd class="d-none d-md-inline">Ctrl K</kbd>
  </button>
  <div class="topbar-actions">
    {% include "partials/_outlet_switch.html" %}
    {% include "partials/_language_switch.html" %}
    <button class="btn-icon" type="button" data-theme-toggle aria-label="{% translate 'Toggle dark mode' %}">
      <i class="bi bi-moon-stars theme-icon-to-dark"></i>
      <i class="bi bi-sun theme-icon-to-light"></i>
    </button>
    {% include "partials/_user_menu.html" %}
  </div>
</header>
