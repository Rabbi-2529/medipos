{% load i18n %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% translate "Server error" %} · ThingBD MediPOS</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f9; color: #33303c; font-family: system-ui, "Hind Siliguri", sans-serif; }
    .box { background: #fff; padding: 2rem; border-radius: 10px; max-width: 420px; box-shadow: 0 4px 18px rgba(47, 43, 61, .08); }
    h1 { margin-top: 0; }
    a { color: #6d5dfc; }
  </style>
</head>
<body>
  <div class="box">
    <h1>{% translate "Something went wrong" %}</h1>
    <p>{% translate "The error has been logged. Please try again in a moment." %}</p>
    <a href="/">{% translate "Back to dashboard" %}</a>
  </div>
</body>
</html>
